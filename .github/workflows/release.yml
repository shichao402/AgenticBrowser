name: Release

# 两条发布路径，共用同一套 relkit 产出（scripts/relkit_producer.mjs）：
#   push tag v<x.y.z>   → stable 渠道（release 档），并附 GitHub Release
#   workflow_dispatch   → dev 渠道（dev 档），只发到 relkit
# 平台 job 只做到 ArtifactSet 为止，不持 token；token 只在 plan（领号）与 publish 两个 job 可见。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  AGENTIC_RELEASE_TAG: ${{ github.ref_name }}
  RELKIT_CHANNEL: ${{ github.event_name == 'push' && 'stable' || 'dev' }}

jobs:
  test:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  # 唯一领号处：releaseCode 由服务器分配，一次发布只领一次，矩阵共用。
  # stable 时 tag 必须等于 v<VERSION.json>，否则在领号前失败。
  plan:
    name: Plan
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
      code: ${{ steps.release.outputs.code }}
      channel: ${{ steps.release.outputs.channel }}
    env:
      PYTHON: python3
      RELKIT_CLI: ${{ github.workspace }}/.relkit/tools/relkit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check stable tag against VERSION.json
        if: env.RELKIT_CHANNEL == 'stable'
        run: node -e 'import("./scripts/relkit-version.mjs").then((m) => m.assertTagMatches(process.env.AGENTIC_RELEASE_TAG, m.readBaseVersion()))'
      - name: Fetch relkit CLI
        run: |
          python3 scripts/relkit_tool.py --component cli --platform linux-amd64 --out-name relkit
          chmod +x "$RELKIT_CLI"
      - id: release
        name: Claim release code
        run: |
          code="$("$RELKIT_CLI" release-code claim)"
          node scripts/relkit-version.mjs --channel "$RELKIT_CHANNEL" --code "$code"
        env:
          RELKIT_CUSTODY_MANIFEST: relkit.custody.json
          RELKIT_UPLOAD_TOKEN: ${{ secrets.RELKIT_UPLOAD_TOKEN }}

  desktop:
    name: Build ${{ matrix.relkit-target }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            relkit-target: windows-amd64
            exe: .exe
            python: python
          - os: macos-15
            relkit-target: darwin-arm64
            exe: ''
            python: python3
          - os: macos-15-intel
            relkit-target: darwin-amd64
            exe: ''
            python: python3
    defaults:
      run:
        shell: bash
    env:
      PYTHON: ${{ matrix.python }}
      CSC_IDENTITY_AUTO_DISCOVERY: false
      RELKIT_CLI: ${{ github.workspace }}/.relkit/tools/relkit${{ matrix.exe }}
      RELKIT_OUT: .relkit/out/${{ matrix.relkit-target }}
    steps:
      # changelog 取自 git 历史，三个平台必须看到同一份完整历史才能 merge。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch relkit CLI
        run: |
          "$PYTHON" scripts/relkit_tool.py --component cli --platform ${{ matrix.relkit-target }} --out-name "relkit${{ matrix.exe }}"
          chmod +x "$RELKIT_CLI" || true
      - name: Build Runtime Bootstrap
        run: '"$RELKIT_CLI" bootstrap build --project relkit.project.json --out .relkit/runtime-bootstrap.json'
      - name: Fetch relkit updater and check proto drift
        run: node scripts/stage-relkit.mjs ${{ matrix.relkit-target }}
      - name: Produce ArtifactSet
        run: |
          rm -rf "$RELKIT_OUT"
          "$RELKIT_CLI" artifacts produce \
            --version "${{ needs.plan.outputs.version }}" \
            --channel "${{ needs.plan.outputs.channel }}" \
            --target ${{ matrix.relkit-target }} \
            --out-dir "$RELKIT_OUT" \
            --out "$RELKIT_OUT/artifact-set.json"
      - uses: actions/upload-artifact@v7
        with:
          name: relkit-out-${{ matrix.relkit-target }}
          path: ${{ env.RELKIT_OUT }}
          if-no-files-found: error

  # 唯一持发布 token 的 job：merge → stage → release 必须在同一工作区完成。
  publish:
    name: Publish to relkit
    needs: [plan, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHON: python3
      RELKIT_CLI: ${{ github.workspace }}/.relkit/tools/relkit
    steps:
      - uses: actions/checkout@v7
      - name: Fetch relkit CLI
        run: |
          python3 scripts/relkit_tool.py --component cli --platform linux-amd64 --out-name relkit
          chmod +x "$RELKIT_CLI"
      - uses: actions/download-artifact@v8
        with:
          pattern: relkit-out-*
          path: .relkit/in
      - name: Merge ArtifactSets
        run: |
          rm -rf .relkit/merged
          "$RELKIT_CLI" artifacts merge \
            --in .relkit/in/relkit-out-windows-amd64/artifact-set.json \
            --in .relkit/in/relkit-out-darwin-arm64/artifact-set.json \
            --in .relkit/in/relkit-out-darwin-amd64/artifact-set.json \
            --out .relkit/merged/artifact-set.json
      - name: Stage
        run: '"$RELKIT_CLI" stage --artifact-set .relkit/merged/artifact-set.json'
      - name: Release plan
        run: '"$RELKIT_CLI" release --version "${{ needs.plan.outputs.version }}"'
      - name: Release
        run: '"$RELKIT_CLI" release --version "${{ needs.plan.outputs.version }}" --execute'
        env:
          RELKIT_RELEASE_VIA_CI: '1'
          RELKIT_CUSTODY_MANIFEST: relkit.custody.json
          RELKIT_UPLOAD_TOKEN: ${{ secrets.RELKIT_UPLOAD_TOKEN }}

  # stable 版本的安装包同时挂到 GitHub Release，作为手动下载入口（应用内“发布页”链接指向这里）。
  github-release:
    name: GitHub Release
    needs: [plan, publish]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: relkit-out-*
          path: installers
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -eu
          shopt -s nullglob
          files=(installers/*-setup.exe installers/*.dmg)
          if [ ${#files[@]} -ne 3 ]; then
            echo "Expected 1 Windows installer and 2 macOS DMGs, got ${#files[@]}"
            ls -la installers
            exit 1
          fi
          notes=$(cat <<EOF
          版本 ${RELEASE_VERSION}。已安装的应用会通过应用内更新自动收到这个版本。

          当前构建未经开发者证书签名。

          - Windows：NSIS 安装包。SmartScreen 可能提示未知发布者。
          - macOS：Apple 芯片（darwin-arm64）与 Intel（darwin-amd64）各一个 DMG。Gatekeeper 可能拦截，需从右键菜单打开。
          EOF
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "AgenticBrowser $GITHUB_REF_NAME" \
              --notes "$notes"
          fi
