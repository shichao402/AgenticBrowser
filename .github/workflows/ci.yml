name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一分支连续推送时，只有最新一次有意义。PR 上取消旧运行以省 runner；
# main 上不取消，保留每个提交的门禁结果作为可追溯记录。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 两个受支持的目标平台都必须通过门禁，避免只在 Windows 上验证过的代码路径
        # 进入 macOS 打包产物。
        os:
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format, lint, typecheck, test, build, and audit
        run: npm run check
