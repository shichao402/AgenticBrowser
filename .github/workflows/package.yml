name: Package

# 手动打一份未接入更新的安装包，用于本地验证 electron-builder 配置。
# 正式发布（stable 与 dev，含 GitHub Release）走 release.yml。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Check VERSION.json
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check package metadata matches VERSION.json
        run: node scripts/version-ssot.mjs check

  package:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 installer
            os: windows-latest
            script: dist:win
            artifact: windows-installer
          - name: macOS DMG
            os: macos-latest
            script: dist:mac
            artifact: macos-installer

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run ${{ matrix.script }}

      - name: Require Windows x64 installer
        if: matrix.artifact == 'windows-installer'
        shell: pwsh
        run: |
          $installers = Get-ChildItem -Path release -Filter "AgenticBrowser-*-win-x64.exe"
          if ($installers.Count -ne 1) {
            Write-Error "Expected one Windows x64 installer"
            exit 1
          }

      - name: Require macOS arm64 and x64 DMGs
        if: matrix.artifact == 'macos-installer'
        run: |
          shopt -s nullglob
          arm64=(release/AgenticBrowser-*-mac-arm64.dmg)
          x64=(release/AgenticBrowser-*-mac-x64.dmg)
          if [ "${#arm64[@]}" -ne 1 ] || [ "${#x64[@]}" -ne 1 ]; then
            echo "Expected one arm64 DMG and one x64 DMG"
            ls -la release
            exit 1
          fi

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.blockmap
            release/*.yml
