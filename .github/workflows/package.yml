name: Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Check VERSION.json
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check package metadata matches VERSION.json
        run: node scripts/version-ssot.mjs check

      - name: Require tag to match VERSION.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node scripts/version-ssot.mjs print)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION.json v$version"
            exit 1
          fi

  package:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 installer
            os: windows-latest
            script: dist:win
            artifact: windows-installer
          - name: macOS DMG
            os: macos-latest
            script: dist:mac
            artifact: macos-installer

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run ${{ matrix.script }}

      - name: Require Windows x64 installer
        if: matrix.artifact == 'windows-installer'
        shell: pwsh
        run: |
          $installers = Get-ChildItem -Path release -Filter "AgenticBrowser-*-win-x64.exe"
          if ($installers.Count -ne 1) {
            Write-Error "Expected one Windows x64 installer"
            exit 1
          }

      - name: Require macOS arm64 and x64 DMGs
        if: matrix.artifact == 'macos-installer'
        run: |
          shopt -s nullglob
          arm64=(release/AgenticBrowser-*-mac-arm64.dmg)
          x64=(release/AgenticBrowser-*-mac-x64.dmg)
          if [ "${#arm64[@]}" -ne 1 ] || [ "${#x64[@]}" -ne 1 ]; then
            echo "Expected one arm64 DMG and one x64 DMG"
            ls -la release
            exit 1
          fi

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.blockmap
            release/*.yml

  release:
    name: GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          shopt -s nullglob
          files=(installers/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installer files"
            exit 1
          fi
          notes=$(cat <<'EOF'
          安装包版本来自 VERSION.json。

          当前构建未签名。

          - Windows：NSIS 安装包。SmartScreen 可能提示未知发布者。
          - macOS：Apple 芯片与 Intel 各一个 DMG。Gatekeeper 可能拦截，需从右键菜单打开。
          EOF
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "AgenticBrowser $GITHUB_REF_NAME" \
              --notes "$notes"
          fi
