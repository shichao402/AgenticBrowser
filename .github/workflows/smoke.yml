name: Smoke

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 冒烟要跑满十二个场景，属于最贵的作业。PR 上只保留最新一次，
# 避免连续推送让多份冒烟同时占用 runner 并互相拖慢。
concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  electron-smoke:
    name: Electron smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # 冒烟覆盖启动编排、watchdog 守护、下载事务与恢复链路，这些是单元测试
        # 触达不到的部分。两个平台的主进程分支不同，都必须跑。
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 每个 smoke:* 脚本内部都会先跑一次 build。这里统一构建一次，下面直接调用
      # electron 或脚本本身，避免同一份产物重复构建十次。
      - name: Build once
        run: npm run build

      # 逐条串行执行，任一场景失败即中断；用 ::group:: 把每个场景的输出折叠，
      # 便于在日志里直接定位是哪一步红了。
      #
      # 每条命令都套一层硬超时：冒烟会拉起并结束真实进程，一旦某个场景在等待
      # 进程退出时挂住，没有超时就会一直占着 runner（实测出现过单步十余分钟
      # 仍未结束）。超时后杀掉整棵进程树并判定失败，让问题立刻可见。
      - name: Run smoke scenarios
        shell: bash
        run: |
          set -euo pipefail
          SMOKE_TIMEOUT_SECONDS=240

          run_smoke() {
            local name="$1"
            shift
            echo "::group::$name"
            if ! timeout --kill-after=15 "${SMOKE_TIMEOUT_SECONDS}s" "$@"; then
              local status=$?
              echo "::error::$name failed or timed out (exit ${status})"
              echo "::endgroup::"
              exit "${status}"
            fi
            echo "::endgroup::"
          }

          run_smoke "Phase 0" npx electron . --smoke-test
          run_smoke "Recovery" npx electron . --recovery-smoke-test
          run_smoke "Strategy fault" npx electron . --strategy-fault-smoke-test
          run_smoke "Strategy workspace" npx electron . --strategy-workspace-smoke-test
          run_smoke "Project download" npx electron . --project-download-smoke-test
          run_smoke "Project download recovery" node scripts/project-download-recovery-smoke.mjs
          run_smoke "Project download fault" node scripts/project-download-fault-smoke.mjs
          run_smoke "Project download renderer recovery" node scripts/project-download-renderer-recovery-smoke.mjs
          run_smoke "Project concurrency" npx electron . --project-concurrency-smoke-test
          run_smoke "Project takeover" npx electron . --project-takeover-smoke-test
          run_smoke "Automation playground" npx electron . --automation-playground-smoke-test
          run_smoke "Watchdog" node scripts/watchdog-smoke.mjs

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results-${{ matrix.os }}
          path: |
            phase*.json
            *smoke-result.json
          if-no-files-found: ignore
          retention-days: 7
