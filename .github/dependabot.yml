version: 2

updates:
  # Electron 及其构建链路的大版本跳跃风险较高，单独分组便于人工评审。
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      electron:
        patterns:
          - electron
          - electron-builder
          - electron-vite
      # vitest 与 @vitest/* 必须同组同版本升级。coverage provider 对
      # vitest 是精确 peer 依赖（peer vitest@5.0.4），拆开升级会让
      # npm ci 直接以 ERESOLVE 失败。
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
      dev-dependencies:
        dependency-type: development

  # Actions 版本也需要跟进，否则会因运行时弃用而突然失败。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
